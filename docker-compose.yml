version: "3.9"

services:
  retail-ai:
    build: .
    image: retail-ai:latest
    container_name: retail-ai-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount the data directory so the SQLite DB and CSVs persist
      # across container rebuilds. Remove this line to use the image-baked DB.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
